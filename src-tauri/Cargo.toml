[package]
name = "eu-toolkit"
version = "0.1.0"
description = "An all-in-one tool for viewing, editing, and creating Europa Universalis IV mods"
authors = ["Ian Conrad"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "eu_toolkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["bmp", "png", "tga", "jpeg"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# The map renderer chews through ~11M pixels; unoptimized debug builds make
# that painfully slow, so keep some optimization even in dev.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

